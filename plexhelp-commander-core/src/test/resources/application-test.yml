spring:
  application:
    name: commander-test
  threads:
    virtual:
      enabled: true
  thymeleaf:
    check-template: false

  mongodb:
    database: videosmover_test

togglz:
  cache:
    enabled: true
    time-to-live: 10000

torrent:
  webui:
    username: admin
    password: adminadmin
    read-timeout: 5000

token:
  security:
    type: SECRET
    secret:
      algo: NONE
    issuer: auth-service-test

tmdb:
  client:
    api-key: testApiKey
    base-url: https://api.themoviedb.org
    read-timeout: 5000

online:
  result-limit: 10
  poster-base: https://image.tmdb.org/t/p/w92

server:
  command:
    name: test-server
    listen-cron: "disabled"
    wsl:
      enabled: false
      system32-path: "/mnt/c/Windows/System32/"
    ssh:
      enabled: false
      port: 22
      host: localhost
      username: changeMe
      password: changeMe
  tomcat:
    threads:
      max: 10
      min-spare: 3

filesystem:
  downloads-path: /test/Downloads
  movies-path: /test/Movies
  tv-path: /test/TV
  cache:
    cron: "0 * * * * *"

search:
  max-depth: 2
  exclude-paths:
    - Excluded
  video-min-size-bytes: 5
  video-mime-types:
    - video/x-matroska
    - video/x-msvideo
    - video/mp4
    - video/x-flv
    - video/quicktime
    - video/x-ms-wmv
    - video/vnd.dlna.mpeg-tts
    - application/x-matroska

rename:
  trim-regex:
    - .[sS](\d{1,2})([-]?[eE](\d{1,2}))?
    - "[\\.\\s][sS][0-9]{1,2}[\\.\\s]?"
    - 1080p
    - 720p
    - 2160p
    - BluRay
    - HDTV
    - x264
    - REPACK
    - WEB-DL
    - BRRip
    - H264
    - AAC
    - XviD
    - AC3
    - HDRip
    - DVDRip
    - WEBRip
    - DVDScr
    - HQ
    - KORSUB
    - BDRip
    - ".?RARBG"
    - "(\\d|\\.){1,5}(GB|MB)"
    - "\\.EXTENDED\\."
    - MP3
    - "(DD)?5\\.1"
    - DTS
    - "Season \\d{1}"
    - DUBBED
  similarity-percent: 80
  max-depth: 3

move:
  restricted-remove-paths:
    - Downloads
  subs-ext:
    - .srt
    - .sub
    - .ssa
    - .ass
    - .usf
    - .idx
    - .ssf
    - .stl
    - .smi
    - .rt
    - .psb
    - .pjs
    - .ttxt
    - .jss
    - .gsub
    - .aqt
    - .nfo
  subs-max-depth: 5

automove:
  cron: "*/10 * * * * *"
  limit: 50
  similarityAccepted: 85
